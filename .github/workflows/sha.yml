name: Get SHA
on: [push]
jobs:
  getsha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Show SHA
        run: |
          cd android/app
          keytool -list -v -keystore my-release-key.keystore -alias zolta -storepass 123456 -keypass 123456 | grep SHA
