name: Build Zolta AAB
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -o "*.zip" || true
          if [ -d "zolta (1)" ]; then
            cp -r "zolta (1)"/*. || true
            rm -rf "zolta (1)"
          fi
          rm -f *.zip
      - name: Fix broken keystore
        run: |
          rm -f android/app/release.keystore
          rm -f android/app/debug.keystore
          keytool -genkey -v -keystore android/app/release.keystore -alias zolta -keyalg RSA -keysize 2048 -validity 10000 -storepass zolta123 -keypass zolta123 -dname "CN=Zolta, OU=Zolta, O=Zolta, L=EL, S=EC, C=ZA"
          ls -lh android/app/*.keystore
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - run: npx cap sync android
      - name: Build AAB
        run: cd android && chmod +x gradlew &&./gradlew bundleRelease -Pandroid.injected.signing.store.file=$PWD/app/release.keystore -Pandroid.injected.signing.store.password=zolta123 -Pandroid.injected.signing.key.alias=zolta -Pandroid.injected.signing.key.password=zolta123
      - name: Build APK
        run: cd android &&./gradlew assembleRelease -Pandroid.injected.signing.store.file=$PWD/app/release.keystore -Pandroid.injected.signing.store.password=zolta123 -Pandroid.injected.signing.key.alias=zolta -Pandroid.injected.signing.key.password=zolta123
      - uses: actions/upload-artifact@v4
        with:
          name: Zolta-AAB
          path: android/app/build/outputs/bundle/release/*.aab
      - uses: actions/upload-artifact@v4
        with:
          name: Zolta-APK
          path: android/app/build/outputs/apk/release/*.apk
