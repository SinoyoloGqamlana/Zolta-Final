name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o zolta.zip -d t && mv t/zolta/* . 2>/dev/null || mv t/* . && rm -rf t zolta.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run build
      - run: npx cap sync android
      - name: Fix Gradle Wrapper
        run: echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-all.zip" > android/gradle/wrapper/gradle-wrapper.properties
      - name: Fix ALL Broken Images
        run: |
          rm -rf android/app/src/main/res/mipmap-*/ic_launcher*.png
          rm -rf android/app/src/main/res/drawable*/splash.png
          mkdir -p android/app/src/main/res/mipmap-hdpi
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+ip1sAAAAASUVORK5CYII=" | base64 -d > /tmp/valid.png
          mkdir -p android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/drawable-land-mdpi android/app/src/main/res/drawable-port-mdpi
          for d in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi drawable drawable-land-mdpi drawable-port-mdpi; do cp /tmp/valid.png android/app/src/main/res/$d/ic_launcher.png 2>/dev/null || true; cp /tmp/valid.png android/app/src/main/res/$d/ic_launcher_round.png 2>/dev/null || true; cp /tmp/valid.png android/app/src/main/res/$d/ic_launcher_foreground.png 2>/dev/null || true; cp /tmp/valid.png android/app/src/main/res/$d/splash.png 2>/dev/null || true; done
          cp /tmp/valid.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp /tmp/valid.png android/app/src/main/res/drawable/splash.png
          cp /tmp/valid.png android/app/src/main/res/drawable-land-mdpi/splash.png
          cp /tmp/valid.png android/app/src/main/res/drawable-port-mdpi/splash.png
      - working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: APK
          path: android/app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AAB
          path: android/app/build/outputs/bundle/release/*.aab
