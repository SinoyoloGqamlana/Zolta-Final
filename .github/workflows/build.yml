name: Build ZOLTA APK + AAB
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o zolta.zip || unzip -o Zolta.zip || true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run build || npx vite build || true
      - run: npm install @capacitor/core @capacitor/cli @capacitor/android
      - run: npx cap add android || true
      - run: npx cap copy android || true
      - run: |
          rm -f android/gradle/wrapper/gradle-wrapper.properties
          mkdir -p android/gradle/wrapper
          echo "distributionBase=GRADLE_USER_HOME" > android/gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> android/gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-all.zip" >> android/gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> android/gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle/wrapper/gradle-wrapper.properties
      - run: |
          for f in $(find android -name "*.png" 2>/dev/null | head -20); do
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+ip1sAAAAASUVORK5CYII=" | base64 -d > "$f" || true
          done
      - run: |
          cd android/app
          rm -f my-release-key.keystore
          keytool -genkey -v -keystore my-release-key.keystore -alias zolta -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=ZOLTA, OU=ZOLTA, O=ZOLTA, L=PE, S=EC, C=ZA"
      - run: |
          python3 << 'PY'
          path = "android/app/build.gradle"
          txt = open(path).read()
          if "my-release-key.keystore" not in txt:
              txt = txt.replace("android {", "android {\n signingConfigs {\n release {\n storeFile file('my-release-key.keystore')\n storePassword '123456'\n keyAlias 'zolta'\n keyPassword '123456'\n }\n }")
          txt = txt.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")
          # ensure release uses signing
          if "buildTypes" in txt and "release" in txt:
              # replace first release { with release with signing
              import re
              txt = re.sub(r'release\s*\{\s*\n', 'release {\n signingConfig signingConfigs.release\n', txt, count=1)
          open(path, "w").write(txt)
          print(txt[:2000])
          PY
      - run: cd android && chmod +x gradlew &&./gradlew assembleRelease bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ZOLTA-AAB-SIGNED
          path: android/app/build/outputs/bundle/release/*.aab
      - uses: actions/upload-artifact@v4
        with:
          name: ZOLTA-APK-SIGNED
          path: android/app/build/outputs/apk/release/*.apk
