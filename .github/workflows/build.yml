name: Build ZOLTA APK + AAB
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o zolta.zip || unzip -o Zolta.zip || true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run build || npx vite build || true
      - run: npm install @capacitor/core @capacitor/cli @capacitor/android
      - run: npx cap add android || true
      - run: npx cap copy android || true
      - run: |
          python3 << 'PY'
          import json, pathlib
          cfg_path = pathlib.Path("capacitor.config.json")
          cfg = json.loads(cfg_path.read_text()) if cfg_path.exists() else {"appId": "com.zolta.app", "appName": "ZOLTA", "webDir": "dist"}
          cfg["server"] = cfg.get("server", {})
          cfg["server"]["allowNavigation"] = ["*.firebaseapp.com","*.web.app","*.firebase.com","*.googleapis.com","sound-loop-5fs6l.firebaseapp.com","sound-loop-5fs6l.web.app"]
          cfg["server"]["cleartext"] = True
          cfg_path.write_text(json.dumps(cfg, indent=2))
          # re-copy after config fix
          PY
      - run: npx cap copy android || true
      - run: |
          python3 << 'PY'
          import pathlib
          m = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          t = m.read_text()
          if "INTERNET" not in t:
              t = t.replace("<application", '<uses-permission android:name="android.permission.INTERNET" />\n <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n <application')
              m.write_text(t)
          PY
      - run: |
          rm -f android/gradle/wrapper/gradle-wrapper.properties
          mkdir -p android/gradle/wrapper
          printf "distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-8.13-all.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n" > android/gradle/wrapper/gradle-wrapper.properties
      - run: |
          cd android/app
          rm -f my-release-key.keystore
          keytool -genkey -v -keystore my-release-key.keystore -alias zolta -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=ZOLTA, OU=ZOLTA, O=ZOLTA, L=PE, S=EC, C=ZA"
      - run: |
          python3 << 'PY'
          import pathlib, base64
          data = base64.b64decode("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+ip1sAAAAASUVORK5CYII=")
          for f in pathlib.Path("android/app/src/main/res").rglob("*.png"):
              f.write_bytes(data)
          PY
      - run: |
          python3 << 'PY'
          import re
          p="android/app/build.gradle"
          app_id=re.search(r'applicationId\s+"([^"]+)"',open(p).read())
          app_id=app_id.group(1) if app_id else "com.zolta.app"
          open(p,"w").write(f'''
          plugins {{ id "com.android.application" }}
          android {{
              namespace "{app_id}"
              compileSdk 36
              defaultConfig {{ applicationId "{app_id}"; minSdk 24; targetSdk 36; versionCode 2; versionName "1.1" }}
              signingConfigs {{ release {{ storeFile file('my-release-key.keystore'); storePassword '123456'; keyAlias 'zolta'; keyPassword '123456'; v1SigningEnabled true; v2SigningEnabled true }} }}
              buildTypes {{ release {{ signingConfig signingConfigs.release; minifyEnabled false }} }}
          }}
          repositories {{ flatDir{{ dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs' }} }}
          dependencies {{
              implementation fileTree(include: ['*.jar'], dir: 'libs')
              implementation project(':capacitor-android')
              implementation project(':capacitor-cordova-android-plugins')
              implementation "androidx.appcompat:appcompat:1.6.1"
              implementation "com.google.android.material:material:1.12.0"
          }}
          apply from: 'capacitor.build.gradle'
          ''')
          PY
      - run: cd android && chmod +x gradlew &&./gradlew assembleRelease bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ZOLTA-AAB-FINAL
          path: android/app/build/outputs/bundle/release/*.aab
      - uses: actions/upload-artifact@v4
        with:
          name: ZOLTA-APK-FINAL
          path: android/app/build/outputs/apk/release/*.apk
