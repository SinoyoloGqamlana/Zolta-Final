name: Build Zolta AAB
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o "*.zip" || true
          if [ -d "zolta (1)" ]; then
            cp -r "zolta (1)"/*.
            cp -r "zolta (1)"/.*. 2>/dev/null || true
            rm -rf "zolta (1)"
          fi
          rm -f *.zip
          ls -la

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Sync to Android
        run: npx cap sync android

      - name: Build AAB
        run: cd android && chmod +x gradlew &&./gradlew bundleRelease

      - name: Build APK
        run: cd android && chmod +x gradlew &&./gradlew assembleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Zolta-AAB
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zolta-APK
          path: android/app/build/outputs/apk/release/*.apk
