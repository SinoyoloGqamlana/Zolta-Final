name: Build ZOLTA APK + AAB
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o zolta.zip || unzip -o Zolta.zip || true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npm run build || npx vite build || true
      - run: npm install @capacitor/core @capacitor/cli @capacitor/android
      - run: npx cap add android || true
      - run: npx cap copy android || true
      - run: rm android/gradle/wrapper/gradle-wrapper.properties
      - run: echo distributionUrl=https://services.gradle.org/distributions/gradle-8.11.1-all.zip > android/gradle/wrapper/gradle-wrapper.properties
      - run: echo distributionBase=GRADLE_USER_HOME >> android/gradle/wrapper/gradle-wrapper.properties
      - run: echo distributionPath=wrapper/dists >> android/gradle/wrapper/gradle-wrapper.properties
      - run: echo zipStoreBase=GRADLE_USER_HOME >> android/gradle/wrapper/gradle-wrapper.properties
      - run: echo zipStorePath=wrapper/dists >> android/gradle/wrapper/gradle-wrapper.properties
      - run: cat android/gradle/wrapper/gradle-wrapper.properties
      - run: cd android && chmod +x gradlew &&./gradlew bundleRelease --no-daemon
      - run: cd android &&./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ZOLTA-AAB-for-PlayStore
          path: android/app/build/outputs/bundle/release/*.aab
      - uses: actions/upload-artifact@v4
        with:
          name: ZOLTA-APK-for-Phone
          path: android/app/build/outputs/apk/release/*.apk
