name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o zolta.zip -d t && mv t/zolta/* . 2>/dev/null || mv t/* . && rm -rf t zolta.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run build
      - run: npx cap sync android
      - name: Fix Gradle Wrapper
        run: echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-all.zip" > android/gradle/wrapper/gradle-wrapper.properties
      - name: Fix Broken Icons
        run: |
          rm -rf android/app/src/main/res/mipmap-*/ic_launcher*.png
          mkdir -p android/app/src/main/res/mipmap-hdpi
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+ip1sAAAAASUVORK5CYII=" | base64 -d > android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png
          mkdir -p android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png android/app/src/main/res/mipmap-mdpi/
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png android/app/src/main/res/mipmap-mdpi/
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png android/app/src/main/res/mipmap-xhdpi/
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png android/app/src/main/res/mipmap-xhdpi/
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png android/app/src/main/res/mipmap-xxhdpi/
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png android/app/src/main/res/mipmap-xxhdpi/
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png android/app/src/main/res/mipmap-xxxhdpi/
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png android/app/src/main/res/mipmap-xxxhdpi/
      - working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: APK
          path: android/app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AAB
          path: android/app/build/outputs/bundle/release/*.aab
