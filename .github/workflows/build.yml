name: Build ZOLTA APK + AAB
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o zolta.zip || unzip -o Zolta.zip || true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run build || npx vite build || true
      - run: npm install @capacitor/core @capacitor/cli @capacitor/android
      - run: npx cap add android || true
      - run: npx cap copy android || true
      - run: rm android/gradle/wrapper/gradle-wrapper.properties
      - run: echo distributionUrl=https://services.gradle.org/distributions/gradle-8.13-all.zip > android/gradle/wrapper/gradle-wrapper.properties
      - run: echo distributionBase=GRADLE_USER_HOME >> android/gradle/wrapper/gradle-wrapper.properties
      - run: echo distributionPath=wrapper/dists >> android/gradle/wrapper/gradle-wrapper.properties
      - run: echo zipStoreBase=GRADLE_USER_HOME >> android/gradle/wrapper/gradle-wrapper.properties
      - run: echo zipStorePath=wrapper/dists >> android/gradle/wrapper/gradle-wrapper.properties
      - run: |
          for f in $(find android/app/src/main/res -name "*.png"); do
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+ip1sAAAAASUVORK5CYII=" | base64 -d > "$f"
          done
      - run: |
          cd android/app
          keytool -genkey -v -keystore my-release-key.keystore -alias zolta -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=ZOLTA, OU=ZOLTA, O=ZOLTA, L=PE, S=EC, C=ZA"
      - run: |
          python3 << 'PY'
          p="android/app/build.gradle"
          t=open(p).read()
          # inject signingConfigs right after android {
          if "MY SIGNING" not in t:
              t=t.replace("android {", "android {\n signingConfigs {\n release {\n storeFile file('my-release-key.keystore')\n storePassword '123456'\n keyAlias 'zolta'\n keyPassword '123456'\n }\n } // MY SIGNING")
              # force release to use it
              t=t.replace("debug {", "debug {\n signingConfig signingConfigs.release\n }\n release {")
              if "signingConfig signingConfigs.release" not in t.split("release {")[1].split("}")[0]:
                  t=t.replace("release {\n", "release {\n signingConfig signingConfigs.release\n", 1)
              # second occurrence for second buildType block if exists
              t=t.replace("release {\n signingConfig", "release {\n signingConfig", 1)
          open(p,"w").write(t)
          print(open(p).read())
          PY
      - run: cd android && chmod +x gradlew &&./gradlew assembleRelease bundleRelease --no-daemon
      - run: ls -l android/app/build/outputs/apk/release/ && ls -l android/app/build/outputs/bundle/release/
      - uses: actions/upload-artifact@v4
        with:
          name: ZOLTA-AAB-for-PlayStore-SIGNED
          path: android/app/build/outputs/bundle/release/*.aab
      - uses: actions/upload-artifact@v4
        with:
          name: ZOLTA-APK-for-Phone-SIGNED
          path: android/app/build/outputs/apk/release/*.apk
