name: Build ZOLTA APK + AAB
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o zolta.zip || unzip -o Zolta.zip || true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run build || npx vite build || true
      - run: npm install @capacitor/core @capacitor/cli @capacitor/android
      - run: npx cap add android || true
      - run: npx cap copy android || true
      - run: |
          rm -f android/gradle/wrapper/gradle-wrapper.properties
          mkdir -p android/gradle/wrapper
          echo "distributionBase=GRADLE_USER_HOME" > android/gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> android/gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-all.zip" >> android/gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> android/gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> android/gradle/wrapper/gradle-wrapper.properties
      - run: |
          cd android/app
          rm -f my-release-key.keystore
          keytool -genkey -v -keystore my-release-key.keystore -alias zolta -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=ZOLTA, OU=ZOLTA, O=ZOLTA, L=PE, S=EC, C=ZA"
      - run: |
          python3 << 'PY'
          import pathlib, base64, re
          png_b64 = "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+ip1sAAAAASUVORK5CYII="
          png_data = base64.b64decode(png_b64)
          res_path = pathlib.Path("android/app/src/main/res")
          for png_file in res_path.rglob("*.png"):
              png_file.write_bytes(png_data)
              print(f"Fixed {png_file}")
          PY
      - run: |
          python3 << 'PY'
          import re
          p = "android/app/build.gradle"
          old = open(p).read()
          app_id = "com.zolta.app"
          m = re.search(r'applicationId\s+"([^"]+)"', old)
          if m:
              app_id = m.group(1)
          new_content = f'''
          plugins {{
              id "com.android.application"
          }}
          android {{
              namespace "{app_id}"
              compileSdk 36
              defaultConfig {{
                  applicationId "{app_id}"
                  minSdk 24
                  targetSdk 36
                  versionCode 1
                  versionName "1.0"
              }}
              signingConfigs {{
                  release {{
                      storeFile file('my-release-key.keystore')
                      storePassword '123456'
                      keyAlias 'zolta'
                      keyPassword '123456'
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }}
              }}
              buildTypes {{
                  release {{
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }}
              }}
          }}
          repositories {{
              flatDir{{
                  dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
              }}
          }}
          dependencies {{
              implementation fileTree(include: ['*.jar'], dir: 'libs')
              implementation project(':capacitor-android')
              implementation project(':capacitor-cordova-android-plugins')
              implementation "androidx.appcompat:appcompat:1.6.1"
              implementation "com.google.android.material:material:1.12.0"
          }}
          apply from: 'capacitor.build.gradle'
          '''
          open(p, "w").write(new_content)
          PY
      - run: cd android && chmod +x gradlew &&./gradlew assembleRelease bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ZOLTA-AAB-GREEN
          path: android/app/build/outputs/bundle/release/*.aab
      - uses: actions/upload-artifact@v4
        with:
          name: ZOLTA-APK-GREEN
          path: android/app/build/outputs/apk/release/*.apk
